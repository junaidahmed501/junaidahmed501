name: Sync README

# README.md is generated by junaidahmed.dev from profile/data.ts and published
# at https://junaidahmed.dev/readme.md. This job pulls it and commits it when it
# changed. No secrets and no third-party actions: the site publishes the file,
# this repo fetches it with its own token.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" .

      - name: Fetch the generated README
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://junaidahmed.dev/readme.md -o /tmp/README.md
          # Only accept the generated file, never an error page or an empty body.
          head -n 1 /tmp/README.md | grep -q '^<!-- Generated from profile/data.ts'
          cp /tmp/README.md README.md

      - name: Commit if it changed
        run: |
          if git diff --quiet; then
            echo "README is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync README from junaidahmed.dev"
          git push
